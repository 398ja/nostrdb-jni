services:
  # REST API service — read-only, headless API access
  rest:
    build: .
    container_name: nostrdb-rest
    ports:
      - "7778:7777"
    volumes:
      - nostrdb-data:/data
    command: ["--db-path", "/data", "--host", "0.0.0.0", "--read-only"]
    environment:
      - JAVA_OPTS=-Xmx256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7777/api/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web app service — full UI with ingest and management
  web:
    build: .
    container_name: nostrdb-web
    ports:
      - "7777:7777"
    volumes:
      - nostrdb-data:/data
    command: ["--db-path", "/data", "--host", "0.0.0.0"]
    environment:
      - JAVA_OPTS=-Xmx256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7777/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nostrdb-data:
